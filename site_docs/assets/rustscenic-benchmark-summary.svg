<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 520" role="img" aria-labelledby="title desc">
  <title id="title">RustScenic real-data benchmark summary</title>
  <desc id="desc">Real-data core end-to-end rows show RustScenic running 11x to 52x faster than SCENIC+ with lower peak RSS on every row.</desc>
  <rect width="1120" height="520" rx="18" fill="#f8fafc"/>
  <g font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">
    <text x="54" y="64" font-size="30" font-weight="780" fill="#111827">Real-data core E2E benchmark</text>
    <text x="54" y="96" font-size="16" fill="#4b5563">Same matrix-level path, fixed seed, Apple M5 laptop, 16 GB RAM, 4 CPU threads.</text>

    <rect x="54" y="126" width="310" height="96" rx="12" fill="#ffffff" stroke="#d8dee8"/>
    <text x="78" y="164" font-size="35" font-weight="820" fill="#c95f24">11x to 52x</text>
    <text x="78" y="195" font-size="16" font-weight="650" fill="#374151">faster than SCENIC+</text>

    <rect x="402" y="126" width="310" height="96" rx="12" fill="#ffffff" stroke="#d8dee8"/>
    <text x="426" y="164" font-size="35" font-weight="820" fill="#1f7a6d">lower RSS</text>
    <text x="426" y="195" font-size="16" font-weight="650" fill="#374151">on every tested real-data row</text>

    <rect x="750" y="126" width="316" height="96" rx="12" fill="#ffffff" stroke="#d8dee8"/>
    <text x="774" y="164" font-size="35" font-weight="820" fill="#2c5aa0">one install</text>
    <text x="774" y="195" font-size="16" font-weight="650" fill="#374151">no Java, dask, CUDA or Snakemake</text>

    <text x="54" y="270" font-size="18" font-weight="760" fill="#111827">Speedup vs SCENIC+</text>
    <text x="792" y="270" font-size="18" font-weight="760" fill="#111827">Peak RSS, GB</text>

    <text x="54" y="317" font-size="15" font-weight="650" fill="#374151">PBMC3k dense</text>
    <rect x="220" y="296" width="500" height="30" rx="7" fill="#e7edf3"/>
    <rect x="220" y="296" width="500" height="30" rx="7" fill="#c95f24"/>
    <text x="736" y="317" font-size="15" font-weight="760" fill="#111827">52x</text>
    <text x="792" y="317" font-size="15" fill="#374151">1.21 / 1.26</text>

    <text x="54" y="361" font-size="15" font-weight="650" fill="#374151">Mouse brain E18</text>
    <rect x="220" y="340" width="500" height="30" rx="7" fill="#e7edf3"/>
    <rect x="220" y="340" width="308" height="30" rx="7" fill="#1f7a6d"/>
    <text x="544" y="361" font-size="15" font-weight="760" fill="#111827">32x</text>
    <text x="792" y="361" font-size="15" fill="#374151">1.65 / 2.10</text>

    <text x="54" y="405" font-size="15" font-weight="650" fill="#374151">Human brain GEM-X</text>
    <rect x="220" y="384" width="500" height="30" rx="7" fill="#e7edf3"/>
    <rect x="220" y="384" width="190" height="30" rx="7" fill="#2c5aa0"/>
    <text x="426" y="405" font-size="15" font-weight="760" fill="#111827">19.7x</text>
    <text x="792" y="405" font-size="15" fill="#374151">2.18 / 2.19</text>

    <text x="54" y="449" font-size="15" font-weight="650" fill="#374151">PBMC10k dense</text>
    <rect x="220" y="428" width="500" height="30" rx="7" fill="#e7edf3"/>
    <rect x="220" y="428" width="108" height="30" rx="7" fill="#6b5b95"/>
    <text x="344" y="449" font-size="15" font-weight="760" fill="#111827">11x</text>
    <text x="792" y="449" font-size="15" fill="#374151">2.37 / 2.63</text>

    <text x="54" y="494" font-size="13" fill="#5f6368">Source: validation/head_to_head/head_to_head_summary.json. RSS format is RustScenic / SCENIC+.</text>
  </g>
</svg>
