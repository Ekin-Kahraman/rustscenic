<text x="72" y="218" font-family="Arial, sans-serif" font-size="20" font-weight="700" fill="#1f7a6d">rustscenic</text>
<text x="72" y="250" font-family="Arial, sans-serif" font-size="13" fill="#4b5563">Single install path</text>
<rect x="296" y="130" width="220" height="150" rx="10" fill="#ffffff" stroke="#d8ded8"/>
<rect x="296" y="130" width="220" height="8" rx="4" fill="#2c5aa0"/>
