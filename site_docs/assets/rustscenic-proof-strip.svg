<text x="314" y="218" font-family="Arial, sans-serif" font-size="20" font-weight="700" fill="#2c5aa0">runtime deps</text>
<text x="314" y="250" font-family="Arial, sans-serif" font-size="13" fill="#4b5563">numpy, pandas, scipy +2</text>
<rect x="538" y="130" width="220" height="150" rx="10" fill="#ffffff" stroke="#d8ded8"/>
<rect x="538" y="130" width="220" height="8" rx="4" fill="#a85b18"/>
<text x="556" y="186" font-family="Arial, sans-serif" font-size="34" font-weight="700" fill="#202124">No</text>
<text x="556" y="218" font-family="Arial, sans-serif" font-size="20" font-weight="700" fill="#a85b18">Java / dask / CUDA</text>
<text x="556" y="250" font-family="Arial, sans-serif" font-size="13" fill="#4b5563">Modern Python plus CPU</text>
<rect x="780" y="130" width="220" height="150" rx="10" fill="#ffffff" stroke="#d8ded8"/>
