<text x="798" y="218" font-family="Arial, sans-serif" font-size="20" font-weight="700" fill="#6b5b95">synthetic cells</text>
<text x="798" y="250" font-family="Arial, sans-serif" font-size="13" fill="#4b5563">Peak memory 7.44 GB</text>
<rect x="1022" y="130" width="220" height="150" rx="10" fill="#ffffff" stroke="#d8ded8"/>
