<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 360" role="img" aria-labelledby="title desc">
  <title id="title">RustScenic workflow</title>
  <desc id="desc">RustScenic workflow from RNA and ATAC matrices through Rust kernels to regulatory network outputs.</desc>
  <rect width="1120" height="360" rx="18" fill="#f8fafc"/>
  <g font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">
    <text x="54" y="62" font-size="30" font-weight="760" fill="#111827">RustScenic core path</text>
    <text x="54" y="94" font-size="16" fill="#4b5563">AnnData in, regulatory programmes out. Rust kernels behind a Python API.</text>

    <rect x="54" y="138" width="160" height="72" rx="10" fill="#ffffff" stroke="#cbd5e1"/>
    <text x="84" y="169" font-size="17" font-weight="700" fill="#111827">RNA</text>
    <text x="84" y="194" font-size="13" fill="#64748b">cells x genes</text>

    <rect x="54" y="236" width="160" height="72" rx="10" fill="#ffffff" stroke="#cbd5e1"/>
    <text x="84" y="267" font-size="17" font-weight="700" fill="#111827">ATAC</text>
    <text x="84" y="292" font-size="13" fill="#64748b">cells x peaks</text>

    <rect x="310" y="116" width="500" height="216" rx="16" fill="#ffffff" stroke="#94a3b8"/>
    <text x="348" y="154" font-size="20" font-weight="760" fill="#111827">Rust kernels</text>
    <g font-size="14" font-weight="650">
      <rect x="348" y="180" width="122" height="42" rx="8" fill="#ecfdf5" stroke="#0f766e"/>
      <text x="382" y="207" fill="#0f766e">GRN</text>
      <rect x="492" y="180" width="122" height="42" rx="8" fill="#fff7ed" stroke="#dc6b2f"/>
      <text x="532" y="207" fill="#b45309">AUCell</text>
      <rect x="636" y="180" width="132" height="42" rx="8" fill="#eff6ff" stroke="#2b5c9a"/>
      <text x="665" y="207" fill="#1d4ed8">cisTarget</text>
      <rect x="348" y="248" width="122" height="42" rx="8" fill="#f1f5f9" stroke="#64748b"/>
      <text x="376" y="275" fill="#334155">Topics</text>
      <rect x="492" y="248" width="122" height="42" rx="8" fill="#f7fee7" stroke="#4f6f2f"/>
      <text x="518" y="275" fill="#4d7c0f">Enhancer</text>
      <rect x="636" y="248" width="132" height="42" rx="8" fill="#fef2f2" stroke="#b91c1c"/>
      <text x="666" y="275" fill="#b91c1c">eRegulons</text>
    </g>

    <rect x="906" y="138" width="160" height="72" rx="10" fill="#ffffff" stroke="#cbd5e1"/>
    <text x="938" y="169" font-size="17" font-weight="700" fill="#111827">Networks</text>
    <text x="938" y="194" font-size="13" fill="#64748b">TF to target</text>

    <rect x="906" y="236" width="160" height="72" rx="10" fill="#ffffff" stroke="#cbd5e1"/>
    <text x="938" y="267" font-size="17" font-weight="700" fill="#111827">Activity</text>
    <text x="938" y="292" font-size="13" fill="#64748b">per cell scores</text>

    <path d="M214 174 H310 M214 272 H310 M810 174 H906 M810 272 H906" stroke="#64748b" stroke-width="4" stroke-linecap="round"/>
    <path d="M298 164 L310 174 L298 184 M298 262 L310 272 L298 282 M894 164 L906 174 L894 184 M894 262 L906 272 L894 282" fill="none" stroke="#64748b" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</svg>
