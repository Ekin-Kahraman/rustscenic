<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 280" role="img" aria-labelledby="title desc">
  <title id="title">RustScenic evidence snapshot</title>
  <desc id="desc">Four RustScenic evidence cards showing built, released, benchmarked and lab-validated status.</desc>
  <rect width="1120" height="280" rx="0" fill="#ffffff"/>
  <g font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">
    <text x="40" y="54" font-size="28" font-weight="760" fill="#111827">Evidence snapshot</text>
    <text x="40" y="84" font-size="15" fill="#4b5563">Release, benchmark and validation artefacts are committed in the repository.</text>

    <rect x="40" y="118" width="246" height="116" rx="8" fill="#fff7ed" stroke="#dc6b2f"/>
    <text x="62" y="154" font-size="15" font-weight="760" fill="#9a3412">BUILT</text>
    <text x="62" y="184" font-size="28" font-weight="780" fill="#111827">CI green</text>
    <text x="62" y="210" font-size="14" fill="#4b5563">Linux, macOS, Windows</text>

    <rect x="314" y="118" width="246" height="116" rx="8" fill="#f8fafc" stroke="#94a3b8"/>
    <text x="336" y="154" font-size="15" font-weight="760" fill="#334155">RELEASED</text>
    <text x="336" y="184" font-size="28" font-weight="780" fill="#111827">v0.4.7</text>
    <text x="336" y="210" font-size="14" fill="#4b5563">PyPI wheels, Python 3.10 to 3.13</text>

    <rect x="588" y="118" width="246" height="116" rx="8" fill="#f0fdf4" stroke="#16a34a"/>
    <text x="610" y="154" font-size="15" font-weight="760" fill="#166534">BENCHMARKED</text>
    <text x="610" y="184" font-size="28" font-weight="780" fill="#111827">11x to 52x</text>
    <text x="610" y="210" font-size="14" fill="#4b5563">Real-data core E2E rows vs SCENIC+</text>

    <rect x="862" y="118" width="218" height="116" rx="8" fill="#eff6ff" stroke="#2563eb"/>
    <text x="884" y="154" font-size="15" font-weight="760" fill="#1d4ed8">LAB-VALIDATED</text>
    <text x="884" y="184" font-size="28" font-weight="780" fill="#111827">16/17 TFs</text>
    <text x="884" y="210" font-size="14" fill="#4b5563">Human brain GEM-X artefact</text>
  </g>
</svg>
