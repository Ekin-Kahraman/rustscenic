name: release

# Fires when a semver tag is pushed (e.g. v0.1.0).
# Manual dispatch builds artefacts for inspection; publishing and GitHub
# Release creation remain tag-gated.
# Builds wheels for Linux x86_64/aarch64 + macOS x86_64/aarch64 +
# Windows x64, sdist, then uploads everything to the GitHub Release.
# PyPI trusted publishing is optional until the PyPI project is configured
# with this workflow's claims.
#
# Setup: in PyPI project Settings → Publishing, add a "Trusted Publisher" for
# this repo/workflow. No API token is stored in GitHub secrets.

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+*'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  wheels-linux:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        target: [x86_64, aarch64]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with: { python-version: '3.12' }
      - uses: docker/setup-qemu-action@v4
        if: matrix.target == 'aarch64'
      - uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.target }}
          manylinux: '2_17'
          args: --release --manifest-path crates/rustscenic-py/Cargo.toml
      - uses: actions/upload-artifact@v7
        with:
          name: wheels-linux-${{ matrix.target }}
          path: target/wheels/*.whl

  wheels-macos:
    runs-on: macos-14
    strategy:
      fail-fast: false
      matrix:
        target: [x86_64, aarch64]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with: { python-version: '3.12' }
      - uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.target }}
          args: --release --manifest-path crates/rustscenic-py/Cargo.toml
      - uses: actions/upload-artifact@v7
        with:
          name: wheels-macos-${{ matrix.target }}
          path: target/wheels/*.whl

  wheels-windows:
    runs-on: windows-2022
    strategy:
      fail-fast: false
      matrix:
        target: [x64]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with: { python-version: '3.12' }
      - uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.target }}
          args: --release --manifest-path crates/rustscenic-py/Cargo.toml
      - uses: actions/upload-artifact@v7
        with:
          name: wheels-windows-${{ matrix.target }}
          path: target/wheels/*.whl

  sdist:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-python@v6
        with: { python-version: '3.12' }
      - run: rm -f target/wheels/*.tar.gz
      - uses: PyO3/maturin-action@v1
        with:
          command: sdist
          args: --manifest-path crates/rustscenic-py/Cargo.toml
      - name: Smoke install sdist
        run: |
          python -m venv /tmp/rustscenic-sdist-smoke
          source /tmp/rustscenic-sdist-smoke/bin/activate
          python -m pip install --upgrade pip
          python -m pip install target/wheels/rustscenic-*.tar.gz
          python - <<'PY'
          import importlib.metadata
          import rustscenic

          for stage in ["grn", "aucell", "topics", "preproc"]:
              getattr(rustscenic, stage)
          print("sdist smoke OK", importlib.metadata.version("rustscenic"))
          PY
      - uses: actions/upload-artifact@v7
        with:
          name: sdist
          path: target/wheels/*.tar.gz

  publish-pypi:
    needs: [wheels-linux, wheels-macos, wheels-windows, sdist]
    runs-on: ubuntu-24.04
    if: startsWith(github.ref, 'refs/tags/v') && vars.PYPI_TRUSTED_PUBLISHING == 'true'
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist
          skip-existing: true

  github-release:
    needs: [wheels-linux, wheels-macos, wheels-windows, sdist, publish-pypi]
    if: |
      always() &&
      startsWith(github.ref, 'refs/tags/v') &&
      needs.wheels-linux.result == 'success' &&
      needs.wheels-macos.result == 'success' &&
      needs.wheels-windows.result == 'success' &&
      needs.sdist.result == 'success' &&
      (needs.publish-pypi.result == 'success' || needs.publish-pypi.result == 'skipped')
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true
      - uses: softprops/action-gh-release@v3
        with:
          files: dist/*
          generate_release_notes: true
