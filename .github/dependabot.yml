version: 2
updates:
  # Rust dependencies (Cargo.lock + workspace Cargo.toml)
  - package-ecosystem: "cargo"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 3
    groups:
      rust-minor:
        update-types:
          - "minor"
          - "patch"
    # statrs 0.18 (our distribution-sampling dep in rustscenic-topics) still
    # depends on rand 0.8. A rand 0.10 bump splits the rand graph and breaks
    # the build. The migration also needs renames (`gen` -> `random`,
    # `gen_range` -> `random_range`, `Rng` -> `RngExt`) and a
    # `rand_core::RngCore` import. Resume rand major bumps once statrs is on
    # rand 0.10. See dependabot PR #67 for the failure modes.
    ignore:
      - dependency-name: "rand"
        update-types: ["version-update:semver-major"]

  # GitHub Actions versions
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 3
    groups:
      actions:
        update-types:
          - "major"
          - "minor"
          - "patch"

  # pyproject.toml python deps
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 3
    # ctxcore 0.2.0 imports pkg_resources, which setuptools removed in 82.0.0.
    # A setuptools bump past <82 lets 82.x install and breaks the reference
    # extra at import time (ModuleNotFoundError: No module named 'pkg_resources').
    # Resume setuptools major bumps once ctxcore drops pkg_resources upstream.
    # See dependabot PR #73 for the failure mode.
    ignore:
      - dependency-name: "setuptools"
        update-types: ["version-update:semver-major"]
