site_name: RustScenic
site_description: Rust and PyO3 regulatory-network toolkit for SCENIC-style single-cell analysis.
site_url: https://ekin-kahraman.github.io/rustscenic/
repo_url: https://github.com/Ekin-Kahraman/rustscenic
repo_name: Ekin-Kahraman/rustscenic
copyright: >-
  Project team: Ekin Kahraman (creator and lead developer), Longtao Huangfu,
  Mohamed El Moussaoui, Fuaad Siyaad and Kuan-Lin Huang.<br>
  <a href="https://github.com/Ekin-Kahraman/rustscenic/blob/main/AUTHORS.md">Team and contributions</a>
edit_uri: edit/main/site_docs/
docs_dir: site_docs
site_dir: site
theme:
  name: mkdocs
  navigation_depth: 3
extra_css:
  - stylesheets/extra.css
nav:
  - Overview: index.md
  - Installation: installation.md
  - Quickstart: quickstart.md
  - CELLxGENE resource: cellxgene-resource.md
  - API Map: api.md
  - HPC operation: hpc.md
  - Benchmarks: benchmarks.md
  - Validation: validation.md
  - Lab Adoption: adoption.md
  - Scope: limitations.md
markdown_extensions:
  - md_in_html
  - tables
  - toc:
      permalink: true
